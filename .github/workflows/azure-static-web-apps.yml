name: Deploy NWCP

on:
  push:
    branches:
      - main

jobs:
  deploy_infrastructure:
    # Bicep is already deployed — skip for now. Re-enable when infra/** changes:
    #   if: contains(github.event.head_commit.modified, 'infra/')  (or use dorny/paths-filter)
    if: false
    runs-on: ubuntu-latest
    name: Deploy Infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AZURE_CREDENTIALS is a JSON object from:
      #   az ad sp create-for-rbac \
      #     --name "github-actions-nerdio-worldcup" \
      #     --role contributor \
      #     --scopes /subscriptions/<SUBSCRIPTION_ID>/resourceGroups/<AZURE_RG_NAME> \
      #     --sdk-auth
      # Add the full JSON output as a GitHub repository secret named AZURE_CREDENTIALS.
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep infrastructure
        run: |
          az deployment group create \
            --resource-group RG-NERDIO-ULB-01 \
            --template-file infra/main.bicep \
            --parameters infra/params/dev.bicepparam

  deploy_api:
    runs-on: ubuntu-latest
    name: Build and Deploy API
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install API dependencies
        working-directory: api
        run: npm install --production

      - name: Deploy Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: func-nerdio-worldcup-dev
          package: api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

  deploy_app:
    runs-on: ubuntu-latest
    name: Build and Deploy App Service
    needs: deploy_api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build frontend
        working-directory: nwcp
        run: |
          npm ci
          npm run build

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-nerdio-worldcup-dev
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: nwcp
