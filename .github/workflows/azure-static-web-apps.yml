name: Deploy NWCP

on:
  push:
    branches:
      - main

jobs:
  deploy_infrastructure:
    # Bicep is already deployed — skip for now. Re-enable when infra/** changes:
    #   if: contains(github.event.head_commit.modified, 'infra/')  (or use dorny/paths-filter)
    if: false
    runs-on: ubuntu-latest
    name: Deploy Infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep infrastructure
        run: |
          az deployment group create \
            --resource-group RG-NERDIO-ULB-01 \
            --template-file infra/main.bicep \
            --parameters infra/params/dev.bicepparam

  deploy_api:
    runs-on: ubuntu-latest
    name: Build and Deploy API
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install API dependencies
        working-directory: api
        run: npm ci --omit=dev

      - name: Deploy Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: func-nerdio-worldcup-dev
          package: api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

  deploy_app:
    runs-on: ubuntu-latest
    name: Build and Deploy App Service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install, build, and prepare deployment package
        working-directory: nwcp
        run: |
          npm ci
          npm run build
          npm prune --production
          test -f server.js
          test -f package.json
          test -d dist
          test -d node_modules/express
          test -d node_modules/http-proxy-middleware
          echo "Deployment package contents:"
          ls -la
          ls -la dist | head -20

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-nerdio-worldcup-dev
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: nwcp
